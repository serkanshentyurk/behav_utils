
# behav_utils — Minimal Config
# Copy this file and adapt it to your project.
# Every key is checked: an unknown or misspelt key raises an error. Keep settings of your own under a
# top-level `custom:` block, which the library never reads.

project:
  name: my_project
  description: "Minimal 2-AFC behavioural analysis"

# ── Reader ───────────────────────────────────────────────────────────────────
# Where the trial tables are. csv_folders: data_dir / <animal> / <session> / <behaviour_file>.
# Relative paths resolve against this file's folder; $ENV_VARS are expanded.
reader:
  type: csv_folders
  data_dir: "./data"
  behaviour_file: "behaviour.csv"      # CSV filename (a glob) within each session dir

# ── Task parameters ──────────────────────────────────────────────────────────
task:
  boundary: 0.0                        # Category boundary, in the CSV's stimulus units
  stimulus_range: [-1.0, 1.0]          # with these defaults the stimulus is used as-is
  primary_stimulus: stimulus           # Which column is the main stimulus
  primary_choice: choice               # Which column is the main choice

  # Choice mapping: how raw CSV choice values become 0 (A) / 1 (B) / NaN (no response)
  choice_mapping:
    type: identity                     # 'identity' (already 0/1), 'spatial_to_category', or 'none'
    no_response_value: -1              # Raw value meaning no response; null if no value does

# ── Column mappings ──────────────────────────────────────────────────────────
# Map internal field names to CSV column names.
# Simple form: internal_name: "CSVColumnName"
# Extended form with dtype, optional, default, value mapping:
#   internal_name:
#     csv_name: "CSVColumnName"
#     dtype: float          # int, float, str, bool
#     optional: false
#     default: null
#     mapping: null         # or {csv_value: internal_value}

columns:
  trial_number: "TrialNumber"          # REQUIRED — every config needs this
  stimulus: "Stimulus"
  choice: "Choice"
  outcome: "Outcome"
  reaction_time:
    csv_name: "ReactionTime"
    dtype: float
    optional: true

# ── Session metadata ─────────────────────────────────────────────────────────
# Columns that are constant within a session (extracted from first row).
session_metadata:
  stage:
    csv_name: "Stage"
    dtype: str
    optional: true
  distribution:
    csv_name: "Distribution"
    dtype: str
    optional: true
    default: "uniform"

# ── Session filter presets ───────────────────────────────────────────────────
# Named presets for select_sessions(animal, preset='expert_uniform')
session_presets:
  expert_uniform:
    stage: "task"
    distribution: "uniform"
    min_accuracy: 0.70
    last_fraction: 0.50
  all_uniform:
    stage: "task"
    distribution: "uniform"
  all_stages: {}                       # No filters — all sessions
