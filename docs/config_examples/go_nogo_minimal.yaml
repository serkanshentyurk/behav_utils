# Auditory go/no-go (minimal columns)
# From docs/config_guide.md — a complete, loadable example.
#
# Two things matter for go/no-go (see "Go/no-go" in the guide):
#   - the withheld response is a choice (0), not a missing value
#   - the go stimuli sit on the positive (category 1) side of the boundary
project:
  name: "Auditory Go/No-Go"

reader:
  type: csv_folders
  data_dir: "/data/auditory_gng"
  behaviour_file: "*.csv"
  date_regex: "(\\d{4})(\\d{2})(\\d{2})"  # compact date: 20260115

task:
  boundary: 8000.0                      # 8 kHz; tones above it are "go"
  stimulus_range: [2000.0, 16000.0]     # frequency in Hz
  stimulus_scale: "log"                 # mapped to [-1, 1] on a log-frequency axis, boundary at 0

  choice_mapping:
    type: "identity"
    no_response_value: -99              # only a real "nothing recorded" row becomes NaN

columns:
  trial_number:
    csv_name: "TrialNum"
    dtype: int
  stimulus:
    csv_name: "Freq_Hz"
    dtype: float
  choice:
    csv_name: "Licked"                  # 0 = no lick (withheld), 1 = lick (go)
    dtype: int
    default: 0                          # a blank cell is a withheld response, not a missing trial
  outcome:
    csv_name: "Result"
    dtype: str
  correct:
    csv_name: "Hit"
    dtype: bool

session_metadata:
  animal_id:
    csv_name: "Mouse"
    dtype: str
