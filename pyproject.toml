[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behav_utils"
dynamic = ["version"]
description = "Analysis library for 2-AFC behavioural data: config-driven loading, session selection, statistics, readouts, contrasts, plotting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Serkan Shentyurk"}]
keywords = ["behaviour", "psychophysics", "2AFC", "neuroscience", "psychometric"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/serkanshentyurk/behav_utils"
Changelog = "https://github.com/serkanshentyurk/behav_utils/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "build", "twine"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "behav_utils.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behav_utils = ["config_presets/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905", "UP006", "UP007", "UP035"]
