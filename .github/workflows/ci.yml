# CI for behav_utils as a repository of its own (this folder is the repo root there).
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ['3.11', '3.14'] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests docs
      - run: pytest tests -q
      - name: The tutorials execute
        run: pip install nbmake ipykernel && pytest --nbmake docs/tutorials/*.ipynb -q
      - name: The example configs load
        run: python -c "import glob; from behav_utils import load_config; [load_config(f) for f in glob.glob('docs/config_examples/*.yaml')]"
      - name: The code on every docs page runs
        run: python docs/run_doc_examples.py
      - name: The generated stats reference is current
        run: python docs/gen_stats_reference.py && git diff --exit-code docs/stats_reference.md
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[docs]"
      - name: The site builds, notebooks executed, warnings as errors
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Keep the built site for two weeks
        uses: actions/upload-artifact@v4
        with: { name: site, path: docs/_build/html, retention-days: 14 }
